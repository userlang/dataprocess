############ElasticSearch相关配置###########
spring:
  # es相关配置
  data:
    elasticsearch:
      # 配置集群名
      cluster-name: elasticsearch   # 访问 es服务端 `http://127.0.0.1:9200/` 填写 `cluster_name` 对应的值
      # 配置节点信息，逗号分隔，如果没有指定，则启动ClientNode 【 注：9200->图形界面端、9300->程序端 】
      cluster-nodes: 127.0.0.1:9300
      # 开启 Elasticsearch 仓库(默认值:true)
      repositories:
        enabled: true

############当前服务配置###########
#服务的端口
server:
  port: 9998

